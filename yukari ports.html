<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ゆかり リクエスト一覧 / 接続チェック</title>
<style>
  :root{
    --ink:#0e0e0e;
    --panel:#1a1a1a;
    --panel-hi:#262626;
    --line:#2e2e2e;
    --text:#f2f2f2;
    --muted:#8e8e8e;
    --live:#ffffff;
    --wait:#a8a8a8;
    --dead:#4a4a4a;
    --accent:#f2f2f2;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
    --sans:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 12px}

  /* ---- header ---- */
  header{
    position:sticky;top:0;z-index:10;
    background:rgba(14,14,14,.88);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  h1{
    margin:0;
    font-size:17px;
    font-weight:700;
    letter-spacing:.02em;
  }
  .sub{
    margin:2px 0 0;
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .sub b{color:var(--live);font-weight:700}
  .controls{display:flex;gap:8px;align-items:center;margin:12px 0 10px}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px}
  .seg button{
    appearance:none;border:0;background:none;color:var(--muted);
    font-family:inherit;font-size:13px;font-weight:600;
    padding:7px 14px;border-radius:999px;cursor:pointer;
  }
  .seg button[aria-pressed="true"]{background:var(--accent);color:#0e0e0e}
  .ghost{
    margin-left:auto;appearance:none;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    font-family:inherit;font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:999px;
  }
  .ghost:disabled{color:var(--muted);cursor:default}
  .find{
    width:100%;margin:0 0 10px;appearance:none;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    color:var(--text);font-family:inherit;font-size:15px;padding:10px 12px;
  }
  .find::placeholder{color:var(--muted)}
  .find:focus{outline:2px solid var(--accent);outline-offset:1px}
  .track{height:2px;background:var(--line)}
  .track i{display:block;height:2px;width:0;background:var(--accent);transition:width .2s linear}
  .track.done i{background:var(--dead)}

  /* ---- notice ---- */
  .notice{
    margin:14px 0 0;padding:12px 14px;
    background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--wait);
    border-radius:12px;font-size:13px;color:var(--muted);line-height:1.65;
  }
  .notice b{color:var(--text)}
  .notice code{font-family:var(--mono);color:var(--text);font-size:12px}

  /* ---- list ---- */
  ul{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  li{display:none}
  li.show{display:block}
  .row{
    position:relative;
    display:grid;grid-template-columns:12px 1fr auto auto;align-items:center;gap:10px;
    min-height:60px;padding:12px 14px;
    background:var(--panel);
    border:1px solid var(--line);border-radius:14px;
    box-shadow:inset 2px 0 0 var(--dead);
  }
  .row:active{background:var(--panel-hi)}
  .hit{position:absolute;inset:0;z-index:1;border-radius:14px;-webkit-tap-highlight-color:transparent}
  .hit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .lamp,.meta{position:relative;z-index:2;pointer-events:none}
  .lamp{width:10px;height:10px;border-radius:50%;background:var(--dead)}
  .name{font-size:16px;font-weight:600;overflow-wrap:anywhere}
  .addr{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .diag{font-family:var(--mono);font-size:11.5px;color:var(--dead);font-variant-numeric:tabular-nums}
  .note{font-size:12px;color:var(--muted)}
  .go{position:relative;z-index:2;pointer-events:none;font-size:20px;color:var(--dead);line-height:1}
  .copy{
    position:relative;z-index:3;appearance:none;cursor:pointer;
    background:var(--panel-hi);border:1px solid var(--line);color:var(--muted);
    font-family:inherit;font-size:12px;font-weight:600;
    padding:7px 11px;border-radius:999px;
  }
  .copy[data-done="1"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}

  [data-status="online"] .row{background:var(--panel-hi);box-shadow:inset 2px 0 0 var(--live)}
  [data-status="online"] .lamp{background:var(--live);box-shadow:0 0 10px rgba(255,255,255,.55)}
  [data-status="online"] .name{font-weight:700}
  [data-status="online"] .go{color:var(--live)}
  [data-status="offline"] .row{opacity:.45}
  [data-status="offline"] .lamp{background:transparent;box-shadow:inset 0 0 0 1.5px var(--dead)}
  [data-status="checking"] .lamp{background:var(--wait);animation:blink 1.1s ease-in-out infinite}
  [data-status="unknown"] .lamp{background:transparent;box-shadow:inset 0 0 0 1.5px var(--wait)}
  @keyframes blink{50%{opacity:.25}}

  .empty{
    margin:32px 4px;color:var(--muted);font-size:14px;text-align:center;
  }
  footer{margin:28px 4px 0;color:var(--muted);font-size:12px;line-height:1.7}
  footer code{font-family:var(--mono);color:var(--text)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>ゆかり リクエスト一覧</h1>
    <p class="sub" id="summary" aria-live="polite">確認中…</p>
    <div class="controls">
      <div class="seg" role="group" aria-label="表示切り替え">
        <button type="button" id="fOnline" aria-pressed="true">接続中</button>
        <button type="button" id="fAll" aria-pressed="false">すべて</button>
      </div>
      <button type="button" class="ghost" id="recheck">再確認</button>
    </div>
    <input class="find" id="find" type="search" inputmode="search"
           placeholder="名前・ポート番号で絞り込む" aria-label="名前・ポート番号で絞り込む">
  </div>
  <div class="track" id="track"><i id="bar"></i></div>
</header>

<main class="wrap">
  <div class="notice" id="notice" hidden></div>
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden></p>
  <footer>
    行をタップすると、そのポートのリクエスト一覧を新しいタブで開きます。<br>
    「コピー」を押すとURLを写します。開けないときは貼り付けて開いてください。<br>
    名前は <code>OWNERS</code> に書き足せます。範囲は <code>'11000-11009'</code> の形で書けます。
  </footer>
</main>

<script>
/* =======================================================================
   設定 —— ここだけ書き換えれば運用できます
   ======================================================================= */
const CONFIG = {
  host: 'ykr.moe',               // ホスト名
  scheme: 'http',                // ゆかりのサーバは http のみ。https にすると全滅します
  path: '/requestlist_only.php', // 既定のパス
  // 調べるポート。カンマ区切り、範囲は - でつなぐ
  //   例: '11000-11130'  /  '11000-11100, 11106, 11200-11210'
  ports: '11000-11130',
  timeoutMs: 4000,          // 1ポートあたりの待ち時間
  concurrency: 24,          // 同時に調べる数
  probeUnnamed: true,       // 名前未登録のポートも調べる（つながれば表示）
  autoRefreshSec: 30,       // 自動で再確認する秒数。0で無効。15未満は非推奨
  debug: true               // 各行に応答時間と失敗理由を出す。運用時は false に
};

/* ポート番号 → 使用者名。ここに書いたポートは ports の範囲外でも必ず調べます。
   キーは '11060' でも '11000-11009' でも可。
   パスやスキームを変えたいポートだけ { } 形式で書きます。
     11061: { name: 'なまえ', path: '/requestlist.php' },
*/
const OWNERS = {
  '11000-11009': 'ゆーふうりん',
  '11010-11015': 'ぬこ',
  '11021-11022': '成田',
  '11024-11025': 'スフィーナ',
  '11026': 'くろっかす',
  '11028': 'タマ兄',
  '11030': 'たち',
  '10031': { name: 'フックン', note: '表のまま。11031の誤記かも' },
  '11032-11035': 'SHINTA',
  '11036': 'よしの',
  '11037': 'しょーきん',
  '11038': 'プリパライム',
  '11040-11041': 'ポケ鉄',
  '11042-11043': '死神フィル',
  '11044': 'Mad Hatter',
  '11045': 'kuruani',
  '11046': '火神',
  '11047': 'カボスSP＋',
  '11048': 'ぬー',
  '11051-11055': 'クロP',
  '11056': '愁',
  '11058': 'すみた',
  '11059': 'つぼはち',
  '11060': 'れん',
  '11061': '百合川',
  '11062': '楽シャア',
  '11063': 'なぎ',
  '11064': 'naoo',
  '11065': 'あにょん',
  '11066': '芝ちゃん',
  '11067': 'crom',
  '11068': 'けんしん',
  '11069': 'けんちぃ',
  '11070-11071': '黒河',
  '11072': 'tokka-ta',
  '11073': 'コウ艦長',
  '11074': 'tukinowa',
  '11075': 'がいばー',
  '11077': 'v3',
  '11078': 'のんでるん',
  '11079': 'まどか',
  '11080-11081': 'ひろりん',
  '11082': 'ヤマテル',
  '11083': 'にいくら',
  '11084-11086': 'タカヒロ＆Lass',
  '11087': 'MiO',
  '11088': '星崎',
  '11089': '月代',
  '11090-11100': { name: 'お試し用', note: '重複覚悟のお試し番号' },
  '11101': 'えみち',
  '11102': 'るえ',
  '11103': 'ながし',
  '11104': 'MrN',
  '11105': 'ヤマテル（2つ目）',
  '11106': '遠見塚',
  '11107': 'blueberry',
  '11108': 'コタ',
  '11109': '姫',
  '11110': '加古1',
  '11111': 'ひろ',
  '11112': 'Yang',
  '11113': '悠季',
  '11114': 'うー',
  '11115': 'unop',
  '11116': 'ルッカ',
  '11117': 'hiro',
  '11122': 'みにゅ'
};
/* ===================================================================== */

/* このページが https で配信されていると、http のポートへの接続確認は
   ブラウザが「混在コンテンツ」として遮断するため、原理的に成立しません。
   その場合は確認をやめ、一覧＋リンクだけを出します。         */
const BLOCKED = location.protocol === 'https:' && CONFIG.scheme === 'http';

const $ = s => document.querySelector(s);
const listEl = $('#list'), sumEl = $('#summary'), barEl = $('#bar'),
      trackEl = $('#track'), emptyEl = $('#empty'), reEl = $('#recheck'),
      noticeEl = $('#notice'), findEl = $('#find');
let entries = [], filter = BLOCKED ? 'all' : 'online',
    query = '', running = false, timer = null, doneCount = 0;

// '11000-11009' → [11000, ... , 11009] / '11060' → [11060]
function parseRange(key){
  const m = String(key).trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);
  if (!m) return [];
  const a = +m[1], b = m[2] ? +m[2] : a;
  const out = [];
  for (let p = Math.min(a, b); p <= Math.max(a, b); p++) out.push(p);
  return out;
}

// OWNERS を「ポート番号 → 設定」に展開する
function ownerMap(){
  const map = new Map();
  for (const [key, val] of Object.entries(OWNERS)){
    const o = typeof val === 'string' ? { name: val } : (val || {});
    for (const p of parseRange(key)) map.set(p, o);
  }
  return map;
}

function build(){
  const owners = ownerMap();
  const set = new Set();
  String(CONFIG.ports).split(',').forEach(part => parseRange(part).forEach(p => set.add(p)));
  owners.forEach((_, p) => set.add(p));

  const out = [];
  for (const p of [...set].filter(p => p > 0 && p < 65536).sort((x, y) => x - y)){
    const o = owners.get(p);
    const named = !!o;
    if (!named && (!CONFIG.probeUnnamed || BLOCKED)) continue; // 確認できない場所では無名行は出さない
    const cfg = o || {};
    const scheme = cfg.scheme || CONFIG.scheme;
    const path = cfg.path || CONFIG.path;
    out.push({
      port: p, named,
      name: named ? cfg.name : 'ポート ' + p,
      note: cfg.note || '',
      url: scheme + '://' + CONFIG.host + ':' + p + path,
      addr: CONFIG.host + ':' + p,
      status: BLOCKED ? 'unknown' : 'checking', ms: null, err: '', el: null
    });
  }
  return out;
}

function render(){
  listEl.textContent = '';
  entries.forEach((e, i) => {
    const li = document.createElement('li');
    li.dataset.status = e.status;
    li.style.order = 1000 + i;

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<a class="hit" target="_blank" rel="noopener"></a>' +
      '<span class="lamp" aria-hidden="true"></span>' +
      '<span class="meta"><span class="name"></span><br><span class="addr"></span>' +
      ' <span class="diag"></span>' +
      (e.note ? ' <span class="note"></span>' : '') + '</span>' +
      '<button class="copy" type="button">コピー</button>' +
      '<span class="go" aria-hidden="true">›</span>';

    const link = row.querySelector('.hit');
    link.href = e.url;
    link.setAttribute('aria-label', e.name + ' のリクエスト一覧を開く');
    row.querySelector('.name').textContent = e.name;
    row.querySelector('.addr').textContent = e.addr;
    if (e.note) row.querySelector('.note').textContent = e.note;
    row.querySelector('.copy').onclick = ev => copyUrl(ev.currentTarget, e.url);

    li.append(row);
    listEl.append(li);
    e.el = li;
  });
  paint();
}

async function copyUrl(btn, url){
  let ok = false;
  try {
    await navigator.clipboard.writeText(url);
    ok = true;
  } catch (_) {
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.append(ta);
    ta.select();
    ta.setSelectionRange(0, url.length);
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  btn.textContent = ok ? 'コピー済' : '長押しでコピー';
  btn.dataset.done = ok ? '1' : '';
  setTimeout(() => { btn.textContent = 'コピー'; btn.dataset.done = ''; }, 1500);
}

function paint(){
  let live = 0, shown = 0;
  const q = query.trim().toLowerCase();
  entries.forEach((e, i) => {
    if (e.status === 'online') live++;
    const hit = !q || (e.name + ' ' + e.port).toLowerCase().includes(q);
    const visible = hit && (
      e.status === 'unknown' ||
      e.status === 'online' ||
      (filter === 'all' && e.status !== 'checking')
    );
    e.el.dataset.status = e.status;
    e.el.classList.toggle('show', visible);
    e.el.style.order = (e.status === 'online' ? 0 : 1000) + i;
    if (visible){
      shown++;
      const d = e.el.querySelector('.diag');
      d.textContent = (CONFIG.debug && e.ms != null)
        ? (e.status === 'online' ? e.ms + 'ms' : e.err + ' ' + e.ms + 'ms')
        : '';
    }
  });

  if (BLOCKED){
    sumEl.textContent = '一覧のみ ' + entries.length + ' ポート（接続確認はこのページでは動きません）';
  } else {
    sumEl.innerHTML = running
      ? '確認中… ' + doneCount + ' / ' + entries.length
      : '接続中 <b>' + live + '</b> / ' + entries.length + ' ポート　' + stamp() +
        (CONFIG.autoRefreshSec > 0 ? '・' + CONFIG.autoRefreshSec + '秒ごとに更新' : '');
  }

  emptyEl.hidden = shown > 0 || running;
  emptyEl.textContent = q
    ? '「' + query.trim() + '」に当たる行はありません。'
    : (live === 0 && !BLOCKED
        ? 'つながっているポートはありません。始まったら「再確認」を押してください。'
        : '表示できる行がありません。「すべて」に切り替えてください。');
}

function stamp(){
  const d = new Date();
  return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2) + ' 時点';
}

async function probe(e){
  const u = new URL(e.url);
  u.searchParams.set('_', Date.now());
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), CONFIG.timeoutMs);
  const t0 = performance.now();
  try {
    await fetch(u, { mode:'no-cors', cache:'no-store', redirect:'follow', signal: ac.signal });
    return { ok: true, ms: Math.round(performance.now() - t0), err: '' };
  } catch (err) {
    return {
      ok: false,
      ms: Math.round(performance.now() - t0),
      // 無応答 = 時間切れ（遮断・応答なし） / 不通 = 即失敗（拒否・遮断）
      err: err && err.name === 'AbortError' ? '無応答' : '不通'
    };
  } finally {
    clearTimeout(t);
  }
}

let firstRun = true;

async function checkAll(){
  if (BLOCKED || running) return;
  running = true;
  reEl.disabled = true;
  trackEl.classList.remove('done');
  barEl.style.width = '0%';
  // 初回だけランプを点滅させる。2回目以降は前回の結果を残したまま裏で更新する
  if (firstRun) entries.forEach(e => e.status = 'checking');
  paint();

  let next = 0;
  doneCount = 0;
  await Promise.all(Array.from({ length: CONFIG.concurrency }, async () => {
    while (next < entries.length){
      const e = entries[next++];
      const r = await probe(e);
      e.status = r.ok ? 'online' : 'offline';
      e.ms = r.ms;
      e.err = r.err;
      doneCount++;
      barEl.style.width = (doneCount / entries.length * 100) + '%';
      paint();
    }
  }));

  running = false;
  firstRun = false;
  reEl.disabled = false;
  trackEl.classList.add('done');
  paint();
  scheduleNext();
}

// 前回の完了から autoRefreshSec 秒後に次を走らせる（重ならない）
function scheduleNext(){
  clearTimeout(timer);
  if (!BLOCKED && CONFIG.autoRefreshSec > 0 && !document.hidden){
    timer = setTimeout(checkAll, CONFIG.autoRefreshSec * 1000);
  }
}

$('#fOnline').onclick = () => setFilter('online');
$('#fAll').onclick = () => setFilter('all');
function setFilter(f){
  filter = f;
  $('#fOnline').setAttribute('aria-pressed', f === 'online');
  $('#fAll').setAttribute('aria-pressed', f === 'all');
  paint();
}
reEl.onclick = checkAll;
findEl.oninput = () => { query = findEl.value; paint(); };

if (BLOCKED){
  // 接続確認に使えない置き場所なので、確認系のUIは畳んでおく
  document.querySelector('.controls').hidden = true;
  trackEl.hidden = true;
  noticeEl.hidden = false;
  noticeEl.innerHTML =
    '<b>このページは https で開かれています。</b>ブラウザは https のページから ' +
    '<code>http://' + CONFIG.host + '</code> への通信を遮断するため、ランプでの接続確認は動きません。' +
    '一覧とリンクだけを表示しています。<br>' +
    '確認まで動かすには、このHTMLを <code>http</code> か手元のファイルとして開いてください' +
    '（例: 保存して <code>python -m http.server</code> で <code>http://localhost:8000/</code>）。';
}

entries = build();
render();
checkAll();

// 画面を見ていない間は止めて、戻ってきたらすぐ確認する
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearTimeout(timer);
  else if (!running) checkAll();
});
</script>
</body>
</html>
