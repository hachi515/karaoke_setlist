name: Update List
run-name: Update List · ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source || github.event_name }}

on:
  schedule:
    # UTCの毎時17分・47分。混雑しやすい正時を避け、遅延に備え30分間隔で起動する。
    # GitHub scheduleは実行時刻や最大間隔を保証しない。外部起動についてはSETUP_UPDATES.md参照。
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 起動元（GASからの自動起動と手動実行を識別）
        type: choice
        required: false
        default: manual
        options:
          - manual
          - gas-hourly
          - external
  push:
    branches: [main]
    paths:
      - update_list.py
      - viewer_template/**
      - cool_analysis.csv
      - requirements.txt
      - tests/**
      - .github/workflows/update.yml
      - .github/gas/**

permissions:
  contents: write

concurrency:
  group: update-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check generation consistency
        run: python -m unittest discover -s tests -v

      - name: Check hourly trigger
        run: node --test tests/test_gas_scheduler.cjs

      - name: Run script
        run: python update_list.py

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git add index.html viewer.html
          git add -- 'history*.csv'
          if git diff --staged --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Auto update list"
          # 同時にstatus/mylistの更新がmainへ入った場合は、取り込み直して再試行する。
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          echo "Failed to push generated changes after 3 attempts" >&2
          exit 1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true
          exclude_assets: '.github,tests,*.py,*.yml,requirements.txt,README.md,SETUP_*.md'
