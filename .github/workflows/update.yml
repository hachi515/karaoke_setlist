name: Update List

on:
  schedule:
    # 10分ごとに実行 (cron構文)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 手動実行ボタンも有効にする

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas requests lxml html5lib

      - name: Run script
        run: python update_list.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          # 履歴CSV (history*.csv) は GAS のみ管理から
          # 「リポジトリ正本 + GAS バックアップ」構成へ変更したため、
          # index.html と一緒にリポジトリへコミットする。
          # history*.csv は初回など存在しないケースもあるため失敗を握り潰す。
          git add index.html
          git add history*.csv 2>/dev/null || true
          
          # 変更がある場合のみコミット
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto update list"
            git pull --rebase origin main
            git push origin main
          fi

      # ★追加: Github Pagesへのデプロイ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./  # index.htmlがあるディレクトリ
          publish_branch: gh-pages  # 公開用ブランチ
          keep_files: true # 既存ファイルを消さない
          exclude_assets: '.github,*.py,*.yml,requirements.txt,README.md' # 不要なファイルを除外
