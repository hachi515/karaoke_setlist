<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ゆかり リクエスト一覧 / 接続チェック</title>
<style>
  :root{
    --ink:#0e0e0e;
    --panel:#1a1a1a;
    --panel-hi:#262626;
    --line:#2e2e2e;
    --text:#f2f2f2;
    --muted:#8e8e8e;
    --live:#ffffff;
    --wait:#a8a8a8;
    --dead:#4a4a4a;
    --accent:#f2f2f2;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
    --sans:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 12px}

  /* ---- header ---- */
  header{
    position:sticky;top:0;z-index:10;
    background:rgba(14,14,14,.88);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  h1{
    margin:0;
    font-size:17px;
    font-weight:700;
    letter-spacing:.02em;
  }
  .sub{
    margin:2px 0 0;
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .sub b{color:var(--live);font-weight:700}
  .controls{display:flex;gap:8px;align-items:center;margin:12px 0 10px}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px}
  .seg button{
    appearance:none;border:0;background:none;color:var(--muted);
    font-family:inherit;font-size:13px;font-weight:600;
    padding:7px 14px;border-radius:999px;cursor:pointer;
  }
  .seg button[aria-pressed="true"]{background:var(--accent);color:#0e0e0e}
  .ghost{
    margin-left:auto;appearance:none;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    font-family:inherit;font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:999px;
  }
  .ghost:disabled{color:var(--muted);cursor:default}
  .track{height:2px;background:var(--line)}
  .track i{display:block;height:2px;width:0;background:var(--accent);transition:width .2s linear}
  .track.done i{background:var(--dead)}

  /* ---- list ---- */
  ul{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  li{display:none}
  li.show{display:block}
  a.row{
    display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:12px;
    min-height:60px;padding:12px 14px;
    background:var(--panel);
    border:1px solid var(--line);border-radius:14px;
    color:inherit;text-decoration:none;
    box-shadow:inset 2px 0 0 var(--dead);
  }
  a.row:active{background:var(--panel-hi)}
  a.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .lamp{width:10px;height:10px;border-radius:50%;background:var(--dead)}
  .name{font-size:16px;font-weight:600;overflow-wrap:anywhere}
  .addr{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .diag{font-family:var(--mono);font-size:11.5px;color:var(--dead);font-variant-numeric:tabular-nums}
  .note{font-size:12px;color:var(--muted)}
  .go{font-size:20px;color:var(--dead);line-height:1}

  [data-status="online"] a.row{background:var(--panel-hi);box-shadow:inset 2px 0 0 var(--live)}
  [data-status="online"] .lamp{background:var(--live);box-shadow:0 0 10px rgba(255,255,255,.55)}
  [data-status="online"] .name{font-weight:700}
  [data-status="online"] .go{color:var(--live)}
  [data-status="offline"] a.row{opacity:.45}
  [data-status="offline"] .lamp{background:transparent;box-shadow:inset 0 0 0 1.5px var(--dead)}
  [data-status="checking"] .lamp{background:var(--wait);animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}

  .empty{
    margin:32px 4px;color:var(--muted);font-size:14px;text-align:center;
  }
  footer{margin:28px 4px 0;color:var(--muted);font-size:12px;line-height:1.7}
  footer code{font-family:var(--mono);color:var(--text)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>ゆかり リクエスト一覧</h1>
    <p class="sub" id="summary" aria-live="polite">確認中…</p>
    <div class="controls">
      <div class="seg" role="group" aria-label="表示切り替え">
        <button type="button" id="fOnline" aria-pressed="true">接続中</button>
        <button type="button" id="fAll" aria-pressed="false">すべて</button>
      </div>
      <button type="button" class="ghost" id="recheck">再確認</button>
    </div>
  </div>
  <div class="track" id="track"><i id="bar"></i></div>
</header>

<main class="wrap">
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden></p>
  <footer>
    つながっているポートだけを緑で表示します。名前は <code>NAMES</code> に書き足してください。<br>
    30秒ごとに自動で確認します（この画面を開いている間だけ）。<br>
    判定は各ポートへの接続確認のみで、中身は読んでいません。
  </footer>
</main>

<script>
/* =======================================================================
   設定 —— ここだけ書き換えれば運用できます
   ======================================================================= */
const CONFIG = {
  host: 'ykr.moe',          // ホスト名
  scheme: 'https',          // 既定のスキーム
  path: '/requestlist_only.php', // 既定のパス
  // 調べるポート。カンマ区切り、範囲は - でつなぐ
  //   例: '11000-11150'  /  '11000-11100, 11106, 11200-11210'
  ports: '11000-11150',
  timeoutMs: 4000,          // 1ポートあたりの待ち時間
  concurrency: 24,          // 同時に調べる数
  probeUnnamed: true,       // 名前未登録のポートも調べる（つながれば表示）
  autoRefreshSec: 30,       // 自動で再確認する秒数。0で無効。15未満は非推奨
  debug: true               // 各行に応答時間と失敗理由を出す。運用時は false に
};

/* ポート番号 → 名前。ここに書いたポートは ports の範囲外でも必ず調べます。
   パスやスキームを変えたい人だけ { } 形式で書きます。
     11060: 'なまえ',
     11061: { name: 'なまえ', path: '/requestlist.php' },
     11062: { name: 'なまえ', scheme: 'http', note: 'httpのみ' },
*/
const NAMES = {
  // 11059: 'なまえ',
  // 11106: 'なまえ',
};
/* ===================================================================== */

const $ = s => document.querySelector(s);
const listEl = $('#list'), sumEl = $('#summary'), barEl = $('#bar'),
      trackEl = $('#track'), emptyEl = $('#empty'), reEl = $('#recheck');
let entries = [], filter = 'online', running = false, timer = null, doneCount = 0;

// '11000-11100, 11106' → [11000, ... , 11106]
function parsePorts(spec){
  const set = new Set();
  String(spec).split(',').forEach(part => {
    const m = part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);
    if (!m) return;
    const a = +m[1], b = m[2] ? +m[2] : a;
    for (let p = Math.min(a, b); p <= Math.max(a, b); p++) set.add(p);
  });
  Object.keys(NAMES).forEach(k => set.add(+k));
  return [...set].filter(p => p > 0 && p < 65536).sort((x, y) => x - y);
}

function build(){
  const out = [];
  for (const p of parsePorts(CONFIG.ports)){
    const raw = NAMES[p];
    const named = raw != null;
    if (!named && !CONFIG.probeUnnamed) continue;
    const o = typeof raw === 'string' ? { name: raw } : (raw || {});
    const scheme = o.scheme || CONFIG.scheme;
    const path = o.path || CONFIG.path;
    out.push({
      port: p, named,
      name: named ? o.name : 'ポート ' + p,
      note: o.note || '',
      url: scheme + '://' + CONFIG.host + ':' + p + path,
      addr: CONFIG.host + ':' + p,
      status: 'checking', ms: null, err: '', el: null
    });
  }
  return out;
}

function render(){
  listEl.textContent = '';
  entries.forEach((e, i) => {
    const li = document.createElement('li');
    li.dataset.status = e.status;
    li.style.order = 1000 + i;
    const a = document.createElement('a');
    a.className = 'row';
    a.href = e.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML =
      '<span class="lamp" aria-hidden="true"></span>' +
      '<span><span class="name"></span><br><span class="addr"></span>' +
      ' <span class="diag"></span>' +
      (e.note ? ' <span class="note"></span>' : '') + '</span>' +
      '<span class="go" aria-hidden="true">›</span>';
    a.querySelector('.name').textContent = e.name;
    a.querySelector('.addr').textContent = e.addr;
    if (e.note) a.querySelector('.note').textContent = e.note;
    li.append(a);
    listEl.append(li);
    e.el = li;
  });
  paint();
}

function paint(){
  let live = 0, shown = 0;
  entries.forEach((e, i) => {
    if (e.status === 'online') live++;
    const visible = e.status === 'online' ||
                    (filter === 'all' && e.status !== 'checking');
    e.el.dataset.status = e.status;
    e.el.classList.toggle('show', visible);
    e.el.style.order = (e.status === 'online' ? 0 : 1000) + i;
    if (visible){
      shown++;
      const d = e.el.querySelector('.diag');
      d.textContent = (CONFIG.debug && e.ms != null)
        ? (e.status === 'online' ? e.ms + 'ms' : e.err + ' ' + e.ms + 'ms')
        : '';
    }
  });
  sumEl.innerHTML = running
    ? '確認中… ' + doneCount + ' / ' + entries.length
    : '接続中 <b>' + live + '</b> / ' + entries.length + ' ポート　' + stamp() +
      (CONFIG.autoRefreshSec > 0 ? '・' + CONFIG.autoRefreshSec + '秒ごとに更新' : '');
  emptyEl.hidden = shown > 0 || running;
  emptyEl.textContent = live === 0
    ? 'つながっているポートはありません。始まったら「再確認」を押してください。'
    : '表示できる行がありません。「すべて」に切り替えてください。';
}

function stamp(){
  const d = new Date();
  return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2) + ' 時点';
}

async function probe(e){
  const u = new URL(e.url);
  u.searchParams.set('_', Date.now());
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), CONFIG.timeoutMs);
  const t0 = performance.now();
  try {
    await fetch(u, { mode:'no-cors', cache:'no-store', redirect:'follow', signal: ac.signal });
    return { ok: true, ms: Math.round(performance.now() - t0), err: '' };
  } catch (err) {
    return {
      ok: false,
      ms: Math.round(performance.now() - t0),
      // 無応答 = 時間切れ（遮断・応答なし） / 不通 = 即失敗（拒否・証明書・混在コンテンツ）
      err: err && err.name === 'AbortError' ? '無応答' : '不通'
    };
  } finally {
    clearTimeout(t);
  }
}

let firstRun = true;

async function checkAll(){
  if (running) return;
  running = true;
  reEl.disabled = true;
  trackEl.classList.remove('done');
  barEl.style.width = '0%';
  // 初回だけランプを点滅させる。2回目以降は前回の結果を残したまま裏で更新する
  if (firstRun) entries.forEach(e => e.status = 'checking');
  paint();

  let next = 0;
  doneCount = 0;
  await Promise.all(Array.from({ length: CONFIG.concurrency }, async () => {
    while (next < entries.length){
      const e = entries[next++];
      const r = await probe(e);
      e.status = r.ok ? 'online' : 'offline';
      e.ms = r.ms;
      e.err = r.err;
      doneCount++;
      barEl.style.width = (doneCount / entries.length * 100) + '%';
      paint();
    }
  }));

  running = false;
  firstRun = false;
  reEl.disabled = false;
  trackEl.classList.add('done');
  paint();
  scheduleNext();
}

// 前回の完了から autoRefreshSec 秒後に次を走らせる（重ならない）
function scheduleNext(){
  clearTimeout(timer);
  if (CONFIG.autoRefreshSec > 0 && !document.hidden){
    timer = setTimeout(checkAll, CONFIG.autoRefreshSec * 1000);
  }
}

$('#fOnline').onclick = () => setFilter('online');
$('#fAll').onclick = () => setFilter('all');
function setFilter(f){
  filter = f;
  $('#fOnline').setAttribute('aria-pressed', f === 'online');
  $('#fAll').setAttribute('aria-pressed', f === 'all');
  paint();
}
reEl.onclick = checkAll;

entries = build();
render();
checkAll();

// 画面を見ていない間は止めて、戻ってきたらすぐ確認する
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearTimeout(timer);
  else if (!running) checkAll();
});
</script>
</body>
</html>
