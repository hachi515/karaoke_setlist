<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ゆかり リクエスト一覧 / 接続チェック</title>
<style>
:root{--bg:#0e0e0e;--panel:#1a1a1a;--panel2:#262626;--line:#303030;--text:#f2f2f2;--muted:#969696;--dead:#505050}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;line-height:1.5;padding-bottom:32px}.wrap{max-width:620px;margin:auto;padding:0 12px}header{position:sticky;top:0;z-index:10;background:#0e0e0ee8;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:calc(14px + env(safe-area-inset-top))}h1{font-size:18px;margin:0}.summary{font:12px ui-monospace,monospace;color:var(--muted);margin:3px 0 10px}.summary b{color:var(--text)}.controls{display:flex;gap:8px;padding-bottom:10px}.controls button,.copy{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 13px;font-weight:700;cursor:pointer}.controls button[aria-pressed="true"]{background:var(--text);color:var(--bg)}#reload{margin-left:auto}.search{width:100%;margin-bottom:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font-size:15px}.notice{margin-top:14px;padding:12px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:12px;background:var(--panel);color:var(--muted);font-size:13px}ul{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:8px}li{display:none}li.show{display:block}.row{position:relative;display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;min-height:62px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:inset 2px 0 var(--dead)}.hit{position:absolute;inset:0;z-index:1}.lamp{width:10px;height:10px;border-radius:50%;background:var(--dead)}.meta,.lamp,.arrow{position:relative;z-index:2;pointer-events:none}.name{font-weight:700}.addr,.diag{font:12px ui-monospace,monospace;color:var(--muted)}.copy{position:relative;z-index:3;padding:7px 10px;font-size:12px}.arrow{font-size:22px;color:var(--dead)}[data-status="online"] .row{background:var(--panel2);box-shadow:inset 2px 0 #fff}[data-status="online"] .lamp{background:#fff;box-shadow:0 0 10px #fff8}[data-status="online"] .arrow{color:#fff}[data-status="offline"] .row{opacity:.45}[data-status="offline"] .lamp{background:transparent;border:1px solid var(--dead)}.empty{text-align:center;color:var(--muted);margin:32px 0}footer{color:var(--muted);font-size:12px;margin-top:24px}
</style>
</head>
<body>
<header><div class="wrap"><h1>ゆかり リクエスト一覧</h1><p id="summary" class="summary">接続状況を取得中…</p><div class="controls"><button id="online" aria-pressed="true">接続中</button><button id="all" aria-pressed="false">すべて</button><button id="reload">再確認</button></div><input id="search" class="search" type="search" placeholder="名前・ポート番号で絞り込む"></div></header>
<main class="wrap"><div id="notice" class="notice" hidden></div><ul id="list"></ul><p id="empty" class="empty" hidden></p><footer>接続状況は GitHub Actions が約5分ごとに更新します。行を押すと各ポートのリクエスト一覧を開きます。</footer></main>
<script>
const CONFIG={host:'ykr.moe',ports:'11000-11130',path:'/requestlist_only.php',statusUrl:'./yukari-status.json',autoRefreshSec:30,staleAfterSec:900};
const OWNERS={
'11000-11009':'ゆーふうりん','11010-11015':'ぬこ','11021-11022':'成田','11024-11025':'スフィーナ','11026':'くろっかす','11028':'タマ兄','11030':'たち','10031':'フックン','11032-11035':'SHINTA','11036':'よしの','11037':'しょーきん','11038':'プリパライム','11040-11041':'ポケ鉄','11042-11043':'死神フィル','11044':'Mad Hatter','11045':'kuruani','11046':'火神','11047':'カボスSP＋','11048':'ぬー','11051-11055':'クロP','11056':'愁','11058':'すみた','11059':'つぼはち','11060':'れん','11061':'百合川','11062':'楽シャア','11063':'なぎ','11064':'naoo','11065':'あにょん','11066':'芝ちゃん','11067':'crom','11068':'けんしん','11069':'けんちぃ','11070-11071':'黒河','11072':'tokka-ta','11073':'コウ艦長','11074':'tukinowa','11075':'がいばー','11077':'v3','11078':'のんでるん','11079':'まどか','11080-11081':'ひろりん','11082':'ヤマテル','11083':'にいくら','11084-11086':'タカヒロ＆Lass','11087':'MiO','11088':'星崎','11089':'月代','11090-11100':'お試し用','11101':'えみち','11102':'るえ','11103':'ながし','11104':'MrN','11105':'ヤマテル（2つ目）','11106':'遠見塚','11107':'blueberry','11108':'コタ','11109':'姫','11110':'加古1','11111':'ひろ','11112':'Yang','11113':'悠季','11114':'うー','11115':'unop','11116':'ルッカ','11117':'hiro','11122':'みにゅ'};
const $=s=>document.querySelector(s);let entries=[],filter='online',query='',timer=null;
function range(v){const m=String(v).match(/^(\d+)(?:-(\d+))?$/);if(!m)return[];const a=+m[1],b=m[2]?+m[2]:a;return Array.from({length:Math.abs(b-a)+1},(_,i)=>Math.min(a,b)+i)}
function ownerMap(){const m=new Map();for(const[k,v]of Object.entries(OWNERS))for(const p of range(k))m.set(p,v);return m}
function build(){const owners=ownerMap(),ports=new Set(range(CONFIG.ports));owners.forEach((_,p)=>ports.add(p));return[...ports].sort((a,b)=>a-b).map(port=>({port,name:owners.get(port)||`ポート ${port}`,url:`http://${CONFIG.host}:${port}${CONFIG.path}`,status:'unknown',ms:null,error:''}))}
function render(){const list=$('#list');list.textContent='';for(const e of entries){const li=document.createElement('li');li.dataset.status=e.status;li.innerHTML=`<div class="row"><a class="hit" target="_blank" rel="noopener"></a><span class="lamp"></span><span class="meta"><span class="name"></span><br><span class="addr"></span> <span class="diag"></span></span><button class="copy">コピー</button><span class="arrow">›</span></div>`;li.querySelector('.hit').href=e.url;li.querySelector('.name').textContent=e.name;li.querySelector('.addr').textContent=`${CONFIG.host}:${e.port}`;li.querySelector('.copy').onclick=async()=>{try{await navigator.clipboard.writeText(e.url)}catch{} };e.el=li;list.append(li)}paint()}
function paint(){let live=0,shown=0;for(const e of entries){if(e.status==='online')live++;const hit=!query||(e.name+' '+e.port).toLowerCase().includes(query.toLowerCase());const visible=hit&&(e.status==='online'||e.status==='unknown'||filter==='all');e.el.dataset.status=e.status;e.el.classList.toggle('show',visible);e.el.style.order=(e.status==='online'?0:1000)+e.port;e.el.querySelector('.diag').textContent=e.ms==null?'':`${e.ms}ms`;if(visible)shown++}$('#summary').innerHTML=`接続中 <b>${live}</b> / ${entries.length} ポート`;$('#empty').hidden=shown>0;$('#empty').textContent=query?'該当する行はありません。':'現在接続中のポートはありません。'}
async function load(){const btn=$('#reload');btn.disabled=true;$('#summary').textContent='接続状況を取得中…';try{const u=new URL(CONFIG.statusUrl,location.href);u.searchParams.set('_',Date.now());const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json(),map=new Map((data.ports||[]).map(x=>[Number(x.port),x]));for(const e of entries){const s=map.get(e.port);e.status=s?.online?'online':'offline';e.ms=Number.isFinite(Number(s?.ms))?Number(s.ms):null;e.error=s?.error||''}const age=data.checked_at?(Date.now()-new Date(data.checked_at))/1000:Infinity;$('#notice').hidden=age<=CONFIG.staleAfterSec;$('#notice').textContent='接続状況の更新が止まっている可能性があります。GitHub Actionsを確認してください。'}catch(err){$('#notice').hidden=false;$('#notice').textContent=`接続状況を取得できません。Actionsの「Check Yukari ports」を実行してください。（${err.message}）`}finally{btn.disabled=false;paint();clearTimeout(timer);timer=setTimeout(load,CONFIG.autoRefreshSec*1000)}}
$('#online').onclick=()=>{filter='online';$('#online').setAttribute('aria-pressed','true');$('#all').setAttribute('aria-pressed','false');paint()};$('#all').onclick=()=>{filter='all';$('#online').setAttribute('aria-pressed','false');$('#all').setAttribute('aria-pressed','true');paint()};$('#reload').onclick=load;$('#search').oninput=e=>{query=e.target.value;paint()};entries=build();render();load();
</script>
</body>
</html>
